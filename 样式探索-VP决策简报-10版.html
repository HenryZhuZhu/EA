<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>VP 决策简报（全公司）· 10 版样式探索 · V1.0.3</title>
<style>
  :root{
    --blue:#0052D9;--blue2:#003FA8;--cyan:#00A4FF;--violet:#7A3DFF;--gold:#b8860b;
    --ink:#0f172a;--t7:#334155;--t6:#475569;--t5:#64748b;--t4:#94a3b8;--t3:#cbd5e1;
    --line:#e2e8f0;--line2:#eef2f7;--bg:#eef2f7;--bg2:#f8fafc;
    --emerald:#16a34a;--amber:#d97706;--rose:#e11d48;--red:#ef4444;--orange:#f97316;--teal:#0d9488;--lime:#84cc16;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .picker{position:sticky;top:0;z-index:50;background:rgba(248,250,252,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:11px 24px}
  .picker .row{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .picker h2{font-size:14px;font-weight:800;margin:0}
  .picker .sub{font-size:11.5px;color:var(--t5)}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .pill{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:999px;height:30px;padding:0 13px;font-size:12px;font-weight:600;color:var(--t6);transition:.12s;display:inline-flex;align-items:center;gap:6px}
  .pill:hover{border-color:var(--t3);color:var(--t7)}
  .pill.on{background:linear-gradient(90deg,#1e293b,#0052D9);border-color:transparent;color:#fff;box-shadow:0 6px 16px -8px rgba(15,23,42,.5)}
  .pill .no{font-weight:800;opacity:.6}.pill.on .no{opacity:.9}
  .vmeta{max-width:1400px;margin:12px auto 0;padding:0 24px;display:flex;align-items:baseline;gap:12px}
  .vmeta .vn{font-size:18px;font-weight:800}.vmeta .vd{font-size:12.5px;color:var(--t5)}
  .wrap{max-width:1400px;margin:0 auto;padding:14px 24px 80px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .ph{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ph .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;background:linear-gradient(135deg,#1e293b,var(--blue))}
  .ph .t{font-size:13px;font-weight:700;color:var(--t7)}
  .ph .x{margin-left:auto;font-size:11px;color:var(--t4)}
  .mut{color:var(--t4);font-size:11px}
  .hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .hd h1{font-size:19px;font-weight:800;margin:0}
  .hd .scope{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--t6)}
  .hd .scope b{color:var(--blue)}
  .hd .role{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(90deg,#1e293b,var(--blue));padding:3px 10px;border-radius:999px}
  .hd .date{margin-left:auto;font-size:12px;color:var(--t5)}
  .hd .exp{border:1px solid var(--line);background:#fff;border-radius:8px;height:28px;padding:0 12px;font-size:12px;font-weight:600;color:var(--t6);cursor:pointer}
  .hd .exp:hover{border-color:var(--blue);color:var(--blue)}

  .kstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
  .kpi{position:relative;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;cursor:pointer;transition:.15s;overflow:hidden}
  .kpi:hover{border-color:var(--t3);box-shadow:0 6px 18px -12px rgba(15,23,42,.3)}
  .kpi.on{border-color:var(--blue);box-shadow:0 8px 22px -12px var(--blue)}
  .kpi .bar0{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .lab{font-size:11px;color:var(--t5)}
  .kpi .val{font-size:24px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .dl{font-size:10px;margin-top:3px;color:var(--t4)}

  /* line compare bars */
  .dbars .db{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .dbars .dn{font-size:12px;font-weight:700;color:var(--t6);width:58px;flex:0 0 auto}
  .dbars .dt{flex:1;height:18px;border-radius:6px;background:var(--line2);overflow:hidden;position:relative}
  .dbars .df{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff;font-weight:700}
  .dbars .dv{font-size:11px;color:var(--t5);width:60px;text-align:right;flex:0 0 auto}

  .heat{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px}
  .heat th{font-size:10.5px;color:var(--t5);font-weight:600;padding:4px;text-align:center}
  .heat th.l{text-align:left}
  .heat td{text-align:center;padding:0}
  .heat td.dn{text-align:left;font-weight:700;color:var(--t7);font-size:12px;padding-left:2px;white-space:nowrap}
  .heat .cell{border-radius:7px;padding:7px 4px;font-weight:700;font-size:12px;color:#fff}
  .heat .sup{font-size:10px;color:var(--t4);font-weight:400}

  svg{display:block;overflow:visible}

  .sl{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line2)}
  .sl .tms{font-size:10px;font-weight:800;color:#fff;background:var(--rose);border-radius:6px;padding:2px 7px;flex:0 0 auto}
  .sl .nm{font-size:12px;color:var(--t7);flex:1;min-width:0}
  .sl .dps{display:flex;gap:3px;flex:0 0 auto}
  .dchip{font-size:9.5px;font-weight:700;color:var(--t6);background:var(--line2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}

  .dec .drow{display:flex;align-items:flex-start;gap:11px;padding:11px;border:1px solid var(--line2);border-radius:11px;margin-bottom:8px;transition:.12s}
  .dec .drow:hover{border-color:var(--t3);background:var(--bg2)}
  .dec .dnum{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#1e293b,var(--blue));color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
  .dec .dc{flex:1;min-width:0}
  .dec .dt{font-size:13px;font-weight:700;color:var(--t7)}
  .dec .dw{font-size:11.5px;color:var(--t5);margin-top:3px}
  .dec .dopt{font-size:11px;font-weight:700;color:var(--blue);background:rgba(0,82,217,.08);border-radius:6px;padding:3px 9px;flex:0 0 auto;align-self:center}
  .lvl{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;color:#fff;flex:0 0 auto}

  .alist .arow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line2);border-radius:10px;margin-bottom:7px;transition:.12s}
  .alist .arow:hover{border-color:var(--t3);background:var(--bg2)}
  .arow .nm{font-size:12.5px;color:var(--t7);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arow .meta{font-size:11px;color:var(--t5);flex:0 0 auto}
  .arow .rsn{font-size:11px;font-weight:600;flex:0 0 auto;width:160px;text-align:right;color:var(--rose)}
  .btns{display:flex;gap:5px;flex:0 0 auto}
  .btn{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;height:27px;padding:0 9px;font-size:11px;font-weight:600;color:var(--t6);transition:.12s}
  .btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(0,82,217,.05)}
  .typ{font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;flex:0 0 auto}
  .typ.esc{background:rgba(225,29,72,.1);color:#e11d48}
  .typ.dec{background:rgba(0,82,217,.1);color:#0052D9}
  .typ.sys{background:rgba(217,119,6,.1);color:#d97706}

  .rank .rrow{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line2)}
  .rank .rno{width:20px;font-size:14px;font-weight:800;color:var(--t4);text-align:center}
  .rank .rn{font-size:13px;font-weight:700;color:var(--t7);width:96px}
  .rank .rn span{font-size:10.5px;color:var(--t4);font-weight:400}
  .rank .rbar{flex:1;height:10px;border-radius:5px;background:var(--line2);overflow:hidden}
  .rank .rf{height:100%;border-radius:5px}
  .rank .rv{font-size:12px;font-weight:700;width:48px;text-align:right}
  .rank .rdot{width:8px;height:8px;border-radius:50%}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0b1220;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:0 14px 30px -8px rgba(15,23,42,.5);opacity:0;transition:.2s;z-index:99;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%)}
  .g2{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin-bottom:14px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
</style>
</head>
<body>
<div class="picker">
  <div class="row">
    <h2>决策简报 · VP 视角</h2>
    <span class="sub">10 版样式 · 全公司 3 条线 · 月度 · 结论先行（平台查看 + 邮件推送）</span>
    <div class="pills" id="pills"></div>
  </div>
</div>
<div class="vmeta"><span class="vn" id="vn"></span><span class="vd" id="vd"></span></div>
<div class="wrap"><div id="stage"></div></div>
<div id="toast"></div>

<script>
/* ============ 共享数据（VP·全公司） ============ */
const LVLC={L1:'#ef4444',L2:'#f97316',L3:'#f59e0b',L4:'#0052D9',L5:'#94a3b8'};
const LINEC={'测试线':'#0052D9','工艺线':'#0d9488','设计线':'#7A3DFF'};
const D={
  period:'2026-05',
  kpis:[
    {k:'all',   lab:'全公司在办 Case', val:114, dl:'3 条线 / 9 部门', c:'var(--blue)', tone:'ink'},
    {k:'sla',   lab:'SLA 按时率（公司）', val:'85%', dl:'目标 ≥90%', c:'var(--emerald)', tone:'emerald'},
    {k:'over',  lab:'逾期 Case', val:18, dl:'跨线', c:'var(--rose)', tone:'rose'},
    {k:'rework',lab:'返工率（公司）', val:'15%', dl:'较上月 ↑1%', c:'var(--amber)', tone:'amber'},
    {k:'risk',  lab:'高风险 / 客户升级', val:13, dl:'含 3 个交付风险', c:'var(--red)', tone:'red'},
    {k:'decide',lab:'待我决策 / 对外', val:3, dl:'战略级', c:'var(--ink)', tone:'ink'},
  ],
  // n, 总监, depts, 在办, SLA%, 逾期, 返工%, 人数, 闭环%, 高风险, 停滞
  lines:[
    {n:'测试线', dir:'高总监', depts:'PTE·CP·FT·DA', cases:52, sla:84, over:9, rework:15, ppl:22, close:89, risk:6, stuck:7},
    {n:'工艺线', dir:'马总监', depts:'PE·QA·EFA',     cases:38, sla:88, over:5, rework:12, ppl:17, close:91, risk:3, stuck:3},
    {n:'设计线', dir:'赵总监', depts:'RD·PM',         cases:24, sla:82, over:4, rework:18, ppl:12, close:86, risk:4, stuck:2},
  ],
  trendSla:[87,86,85,84,86,85],
  trendCases:[95,102,108,110,112,114],
  trendRework:[13,14,14,15,15,15],
  months:['12月','1月','2月','3月','4月','5月'],
  systemic:[
    {nm:'DDR4 PKG 内引线偏移', lines:['测试线','工艺线'], times:8, note:'跨 2 线·影响 3 客户'},
    {nm:'先进封装良率爬坡慢', lines:['工艺线','设计线'], times:5, note:'新产品导入共性'},
    {nm:'车规客户A交付风险', lines:['测试线','设计线'], times:4, note:'季度交付节点'},
  ],
  items:[
    {type:'esc', nm:'车规客户A · DDR4 退货交付风险', dept:'测试线·设计线', lvl:'L1', rsn:'交付节点·客户升级', tags:['risk','over']},
    {type:'esc', nm:'CP1 大面积 yield drop（跨线）', dept:'测试线·工艺线', lvl:'L1', rsn:'影响月度产出', tags:['risk']},
    {type:'dec', nm:'是否成立 DDR4 PKG 跨线攻关组', dept:'测试·工艺', lvl:'', rsn:'累计返工 8 次·单线难解', tags:['decide','rework'], opt:'建议成立'},
    {type:'dec', nm:'Q3 测试产能是否扩编 5 人', dept:'测试线', lvl:'', rsn:'在办 52·人均最高·逾期最多', tags:['decide'], opt:'建议扩编'},
    {type:'sys', nm:'设计线返工率 18% 引入 DFM 评审', dept:'设计线', lvl:'', rsn:'连续 2 月高于公司均值', tags:['rework'], opt:'建议引入'},
  ],
  highlights:['工艺线闭环率 91% 全公司第一','公司月度在办量趋稳（+2%）','EFA 失效定位周期缩短 18%'],
};

/* ============ 渲染片段 ============ */
let activeKpi='all';
function header(extra){return `<div class="hd"><h1>决策简报</h1><span class="role">VP · 林副总</span><span class="scope">全公司：<b>测试 · 工艺 · 设计</b> 3 线 / 9 部门</span>${extra||''}<button class="exp" onclick="act('推送','2026-05 月度经营简报')">✉ 推送/转发</button><button class="exp" onclick="act('导出','2026-05 月度经营简报')">⤓ 导出 PDF</button><span class="date">${D.period} 月报 · 截至 2026-05-31</span></div>`;}
function kpiCard(k,style){
  const on=activeKpi===k.k?' on':'';
  const col=k.tone==='emerald'?'var(--emerald)':k.tone==='rose'||k.tone==='red'?'var(--rose)':k.tone==='amber'?'var(--amber)':'var(--ink)';
  if(style==='mini')return `<div class="kpi${on}" data-kpi="${k.k}" style="padding:9px 11px"><div style="display:flex;align-items:baseline;gap:7px"><span class="val" style="font-size:19px;color:${col}">${k.val}</span><span class="lab">${k.lab}</span></div></div>`;
  return `<div class="kpi${on}" data-kpi="${k.k}"><span class="bar0" style="background:${k.c}"></span><div class="lab">${k.lab}</div><div class="val" style="color:${col}">${k.val}</div><div class="dl">${k.dl}</div></div>`;
}
function kpiStrip(style){return `<div class="kstrip">${D.kpis.map(k=>kpiCard(k,style)).join('')}</div>`;}

function lineBars(metric,opt){
  opt=opt||{};
  const fmt=opt.pct?(v=>v+'%'):(v=>v+(opt.unit||''));
  const vals=D.lines.map(d=>d[metric]);
  const max=Math.max(...vals,opt.target||0);
  const color=d=>{
    if(metric==='sla')return d.sla>=90?'#16a34a':d.sla>=85?'#84cc16':d.sla>=82?'#f59e0b':'#e11d48';
    if(metric==='rework')return d.rework<=12?'#16a34a':d.rework<=16?'#f59e0b':'#e11d48';
    if(metric==='over')return d.over>=8?'#e11d48':d.over>=5?'#f59e0b':'#84cc16';
    return LINEC[d.n];
  };
  return `<div class="dbars">${D.lines.map(d=>`<div class="db"><span class="dn">${d.n}</span><span class="dt">${opt.target?`<span style="position:absolute;left:${opt.target/max*100}%;top:0;bottom:0;width:2px;background:rgba(15,23,42,.25)"></span>`:''}<span class="df" style="width:${Math.max(d[metric]/max*100,8)}%;background:${color(d)}">${fmt(d[metric])}</span></span><span class="dv">${d.dir}</span></div>`).join('')}</div>${opt.target?`<div class="mut" style="margin-top:2px">竖线＝目标 ${fmt(opt.target)}</div>`:''}`;
}

function heatTable(){
  const cols=[['cases','在办',null],['sla','SLA%',v=>v>=90?'#16a34a':v>=85?'#22c55e':v>=82?'#f59e0b':'#e11d48',true],
    ['over','逾期',v=>v>=8?'#e11d48':v>=5?'#f59e0b':'#84cc16'],
    ['rework','返工%',v=>v<=12?'#16a34a':v<=16?'#f59e0b':'#e11d48',true],
    ['close','闭环%',v=>v>=90?'#16a34a':v>=87?'#22c55e':'#f59e0b',true],
    ['risk','高风险',v=>v>=6?'#e11d48':v>=4?'#f59e0b':'#84cc16']];
  let h='<table class="heat"><tr><th class="l">线 / 总监</th>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr>';
  D.lines.forEach(d=>{h+=`<tr><td class="dn">${d.n} <span class="sup">${d.dir}·${d.depts}</span></td>`+cols.map(c=>{const v=d[c[0]];if(!c[2])return `<td><div class="cell" style="background:#475569">${v}</div></td>`;return `<td><div class="cell" style="background:${c[2](v)}">${v}${c[3]?'%':''}</div></td>`;}).join('')+'</tr>';});
  return h+'</table>';
}

function spark(data,color,w,h,opt){
  w=w||240;h=h||64;opt=opt||{};
  const max=opt.max!=null?opt.max:Math.max(...data),min=opt.min!=null?opt.min:Math.min(...data);
  const rng=(max-min)||1;
  const X=i=>i/(data.length-1)*w, Y=v=>h-6-((v-min)/rng)*(h-14);
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area=`M0 ${h} L`+pts.map(p=>`${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' L')+` L${w} ${h} Z`;
  const id='g'+Math.floor(min*97+max*13+data.length+color.length);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${opt.band?`<line x1="0" y1="${Y(opt.band)}" x2="${w}" y2="${Y(opt.band)}" stroke="#16a34a" stroke-dasharray="3 3" stroke-width="1"/>`:''}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.4" fill="${color}"/></svg>`;
}
function trendCard(title,data,color,cur,opt){return `<div><div style="display:flex;align-items:baseline;justify-content:space-between"><span class="mut">${title}</span><span style="font-size:16px;font-weight:800;color:${color}">${cur}</span></div>${spark(data,color,240,54,opt)}<div class="mut" style="display:flex;justify-content:space-between"><span>${D.months[0]}</span><span>${D.months[D.months.length-1]}</span></div></div>`;}

function systemicHTML(){return D.systemic.map(s=>`<div class="sl"><span class="tms">×${s.times}</span><span class="nm">${s.nm}</span><span class="dps">${s.lines.map(d=>`<span class="dchip" style="border-color:${LINEC[d]}55;color:${LINEC[d]}">${d}</span>`).join('')}</span></div>`).join('');}

function lineScore(d){return Math.round(d.sla*.4 + d.close*.3 + (100-d.rework*2)*.2 + (100-d.over*4)*.1);}
function rankHTML(){
  const ranked=[...D.lines].map(d=>({...d,score:lineScore(d)})).sort((a,b)=>b.score-a.score);
  return `<div class="rank">${ranked.map((d,i)=>{const c=d.score>=85?'#16a34a':d.score>=82?'#f59e0b':'#e11d48';return `<div class="rrow"><span class="rno">${i+1}</span><span class="rdot" style="background:${c}"></span><span class="rn">${d.n} <span>${d.dir}</span></span><span class="rbar"><span class="rf" style="width:${d.score}%;background:${c}"></span></span><span class="rv" style="color:${c}">${d.score} 分</span></div>`;}).join('')}</div>`;}

function itemsFiltered(){return D.items.filter(t=>activeKpi==='all'||t.tags.includes(activeKpi));}
function actionListHTML(){
  const rows=itemsFiltered();
  const TY={esc:'对外/介入',dec:'决策',sys:'专项'};
  const body=rows.map(t=>`<div class="arow">
    <span class="typ ${t.type}">${TY[t.type]}</span>
    ${t.lvl?`<span class="lvl" style="background:${LVLC[t.lvl]}">${t.lvl}</span>`:''}
    <span class="nm">${t.nm}</span>
    <span class="meta">${t.dept}</span>
    <span class="rsn">${t.rsn}</span>
    <span class="btns"><button class="btn" onclick="act('下钻','${t.nm}')">下钻</button><button class="btn" onclick="act('指派总监','${t.nm}')">指派总监</button><button class="btn" onclick="act('导出','${t.nm}')">导出</button></span></div>`).join('');
  const info=`${rows.length} 项 · 筛选：${(D.kpis.find(k=>k.k===activeKpi)||{}).lab||'全部'}`;
  return {body,info};
}
function decisionHTML(){return `<div class="dec">${D.items.filter(t=>t.type==='dec'||t.type==='sys').map((t,i)=>`<div class="drow"><span class="dnum">${i+1}</span><div class="dc"><div class="dt">${t.nm}</div><div class="dw">${t.rsn} · ${t.dept}</div></div><span class="dopt">${t.opt||'待定'}</span></div>`).join('')}</div>`;}
function escalateHTML(){return D.items.filter(t=>t.type==='esc').map(t=>`<div class="arow"><span class="lvl" style="background:${LVLC[t.lvl]}">${t.lvl}</span><span class="nm">${t.nm}</span><span class="meta">${t.dept}</span><span class="rsn">${t.rsn}</span><span class="btns"><button class="btn" onclick="act('下钻','${t.nm}')">下钻</button></span></div>`).join('');}

let _tt;
function act(kind,nm){const t=document.getElementById('toast');const m=kind==='下钻'?`下钻至「${nm}」对应总监决策台 / 关联 case`:kind==='导出'?`已导出「${nm}」（PDF）`:kind==='推送'?`已推送「${nm}」至邮箱 / 转发给相关总监`:kind==='指派总监'?`已将「${nm}」指派至对应总监跟进`:`已${kind}：「${nm}」`;t.textContent='✓ '+m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2300);}
function bindKpi(){document.querySelectorAll('[data-kpi]').forEach(el=>{el.onclick=()=>{const k=el.dataset.kpi;if(k==='sla')return;activeKpi=k;render();};});}
function refreshList(){const r=actionListHTML();const b=document.getElementById('alist');if(b)b.innerHTML=r.body;const i=document.getElementById('listInfo');if(i)i.textContent=r.info;}

/* ============ 版本专属样式 ============ */
const VCSS=`

.mh-cc{margin-left:auto;font-size:11px;color:var(--t4)}

.mail-body{padding:22px}
.ml-lead{font-size:13.5px;line-height:1.8;color:var(--t6);margin-bottom:18px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.ml-sec{margin-bottom:20px}
.ml-h{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:10px}
.mail-cta{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.cta{cursor:pointer;border:none;background:linear-gradient(90deg,#1e293b,var(--blue));color:#fff;border-radius:9px;height:34px;padding:0 16px;font-size:12.5px;font-weight:700}
.cta.ghost{background:#fff;border:1px solid var(--line);color:var(--t6)}
.cta:hover{filter:brightness(1.05)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.bento-k,.bento-c{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;overflow:hidden}
.bt{font-size:11.5px;font-weight:700;color:var(--t7);margin-bottom:8px}
.sig{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px}
.sig-col{border-radius:14px;padding:13px;border:1px solid}
.sig-col.red{background:linear-gradient(180deg,rgba(225,29,72,.06),#fff);border-color:rgba(225,29,72,.26)}
.sig-col.amber{background:linear-gradient(180deg,rgba(217,119,6,.06),#fff);border-color:rgba(217,119,6,.24)}
.sig-col.green{background:linear-gradient(180deg,rgba(22,163,74,.06),#fff);border-color:rgba(22,163,74,.22)}

.red .sig-dot{background:#e11d48}.amber .sig-dot{background:#d97706}.green .sig-dot{background:#16a34a}

.mc-h{font-size:12.5px;font-weight:700;color:var(--t7);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line2)}
.exec{max-width:980px}

.er-d{grid-column:2;margin-top:10px}

.ex-nums span{font-size:12px;color:var(--t5);display:flex;flex-direction:column;cursor:pointer}
.ex-nums span b{font-size:21px;font-weight:800;line-height:1.1}
.ex-nums span.on b{text-decoration:underline}
`;
const st=document.createElement('style');st.textContent=VCSS;document.head.appendChild(st);

/* ============ 切换 ============ */
let cur=0;
const pills=document.getElementById('pills');
VERSIONS.forEach((v,i)=>{const b=document.createElement('button');b.className='pill'+(i===0?' on':'');b.innerHTML=`<span class="no">${String(i+1).padStart(2,'0')}</span>`;b.onclick=()=>{cur=i;render();};pills.appendChild(b);});
function render(){
  const v=VERSIONS[cur];
  document.getElementById('vn').textContent=v.name;
  document.getElementById('vd').textContent=v.desc;
  [...pills.children].forEach((c,i)=>c.classList.toggle('on',i===cur));
  document.getElementById('stage').innerHTML=v.render();
  bindKpi();refreshList();
}
render();
</script>
