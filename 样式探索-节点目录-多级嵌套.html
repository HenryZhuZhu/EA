<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EA · 节点目录（多级嵌套）样式探索</title>
<style>
  :root{
    --brand:#0052D9; --brand2:#00A4FF;
    --ink900:#0f172a; --ink800:#1e293b; --ink700:#334155; --ink600:#475569; --ink500:#64748b; --ink400:#94a3b8;
    --line:#e2e8f0; --line2:#f1f5f9; --bg:#f6f8fc;
    --amber:#f59e0b; --blue:#3b82f6; --emerald:#10b981; --rose:#f43f5e; --slate:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink700);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:32px 28px 90px}
  h1{font-size:26px;font-weight:800;color:var(--ink900);letter-spacing:-.01em;margin:0}
  .sub{color:var(--ink500);margin-top:6px;font-size:14px;max-width:880px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px;margin-top:26px;align-items:start}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .panel .ph .badge{font-size:11px;color:#fff;background:var(--brand);border-radius:999px;padding:2px 9px;font-weight:600}
  .panel .ph .nm{font-weight:700;color:var(--ink900);font-size:15px}
  .panel .pd{color:var(--ink500);font-size:12.5px;margin:0 0 14px;min-height:34px}
  svg{display:inline-block;vertical-align:middle}

  /* directory shell */
  .dir{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dh{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line2);background:#fcfdff}
  .dh .ic{width:28px;height:28px;border-radius:8px;background:rgba(0,82,217,.08);color:var(--brand);display:grid;place-items:center;flex:none}
  .dh .t{font-weight:600;color:var(--ink900);font-size:13.5px}
  .dh .s{font-size:11px;color:var(--ink400)}
  .dh .spacer{flex:1}
  .dh .mini{font-size:11px;color:var(--ink400)}
  .dh .tool{font-size:11px;color:var(--brand);cursor:pointer;user-select:none}
  .list{padding:7px;max-height:460px;overflow:auto}

  /* generic row */
  .row{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:8px;min-width:0}
  .row[data-toggle]{cursor:pointer}
  .row:hover{background:var(--bg)}
  .nm{font-size:13px;color:var(--ink800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .nm.t{font-weight:600;color:#b45309}
  .muted{color:var(--ink400);font-size:11px;white-space:nowrap;flex:none}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chev{flex:none;color:var(--ink400);transition:transform .15s;width:14px;height:14px}
  .node.collapsed>.row .chev,.node.collapsed>.ghead .chev{transform:rotate(-90deg)}
  .chev-sp{width:14px;flex:none}
  .node.collapsed>.children{display:none}

  /* S1 file-tree guides */
  .s1 .children{margin-left:14px;padding-left:10px;border-left:1px dashed var(--line)}
  /* S2 numbered */
  .s2 .children{margin-left:16px}
  .s2 .num{font-size:10.5px;color:var(--ink400);font-variant-numeric:tabular-nums;flex:none;min-width:30px}
  .s2 .num.t{color:#b45309;font-weight:700}
  /* S3 nested cards */
  .gcard{border-radius:10px;border:1px solid var(--line2);margin:5px 0;overflow:hidden}
  .gcard.g-th{background:#fffaf0;border-color:#fde9c8}
  .gcard.g-tk{background:#f8fafc;border-color:#eef2f7}
  .ghead{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer}
  .gname{font-size:12.5px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-th .gname{color:#b45309}.g-tk .gname{color:var(--ink800)}
  .gbody{padding:2px 7px 7px}
  .leaf{margin-left:2px}
  /* S5 summary chips */
  .sumwrap{display:flex;align-items:center;gap:5px;flex:none}
  .sumdots{display:flex;gap:2px}
  .sumdots .d{width:6px;height:6px;border-radius:50%}
  .pill{font-size:10px;color:var(--ink500);background:var(--line2);border-radius:999px;padding:1px 7px;white-space:nowrap}
  .bar{height:4px;width:46px;border-radius:3px;background:var(--line2);overflow:hidden;flex:none}
  .bar>span{display:block;height:100%;border-radius:3px}
  /* S4 drill */
  .crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:9px 11px;border-bottom:1px solid var(--line2);font-size:12px}
  .crumb a{color:var(--brand);cursor:pointer}.crumb .sep{color:var(--ink300,#cbd5e1)}
  .crumb .cur{color:var(--ink600);font-weight:600}
  .drow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:default}
  .drow:hover{background:var(--bg)}
  .drow.has{cursor:pointer}
  .cnt{font-size:10px;color:var(--ink400);background:var(--line2);border-radius:999px;padding:1px 7px;white-space:nowrap}
  .footnote{margin-top:18px;color:var(--ink400);font-size:12px}
  .tag-cat{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:5px;font-size:10px;background:#fef3c7;color:#b45309;border:1px solid #fde68a;flex:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>节点目录 · 多级嵌套展示方案</h1>
  <p class="sub">真实的怀疑树是<strong>多层递归</strong>的：思路 → 执行任务 → 派生子思路 → 子任务……。下面 5 版方案都基于同一棵 4 层深的示例树，均可<strong>点击折叠/展开</strong>。挑你觉得最便于"看清 Case 整体"的一版（可与图标方案混搭），告诉我编号我接入 Case 详情右侧目录。</p>

  <div class="grid" id="grid"></div>

  <p class="footnote">© EA V0.2 · 样式探索（静态预览，折叠可交互）</p>
</div>

<script>
/* ---------- icons ---------- */
const P={
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>',
  chev:'<path d="M6 9l6 6 6-6"/>',
  listTree:'<path d="M9 6h11M12 12h8M15 18h5M3 6v.01M3 6a2 2 0 0 1 2-2M6 12H5a2 2 0 0 1-2-2V6M9 18H7a2 2 0 0 1-2-2v-4"/>',
  bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 .9 1 1.8v.5h6v-.5c0-.9.4-1.3 1-1.8A7 7 0 0 0 12 2z"/>',
};
function svg(n,s,sw){return '<svg width="'+(s||14)+'" height="'+(s||14)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+'" stroke-linecap="round" stroke-linejoin="round" class="'+(n==='chev'?'chev':'')+'">'+P[n]+'</svg>';}
const SC={待开始:'#94a3b8',待接受:'#f59e0b',进行中:'#3b82f6',已完成:'#10b981',已中止:'#94a3b8',已拒绝:'#f43f5e'};

/* ---------- deep nested sample tree ---------- */
const TREE=[
  {kind:'thought',name:'Pattern 异常导致 ICC2 超规格',cat:'测试程式',children:[
    {kind:'task',name:'ICC2 分布分析与 Pattern 定位',status:'已完成',owner:'张伟',dept:'PTE',prog:100,children:[
      {kind:'thought',name:'是否为特定 Pattern 触发',cat:'Pattern',children:[
        {kind:'task',name:'Pattern 逐项回放比对',status:'进行中',owner:'李娜',dept:'PTE',prog:60,children:[]},
        {kind:'task',name:'关键 Pattern margin 复测',status:'待开始',owner:'王芳',dept:'CP',prog:0,children:[]},
      ]},
    ]},
    {kind:'task',name:'输出 Pattern 调整方案评审稿',status:'待接受',owner:'张伟',dept:'PTE',prog:40,children:[]},
  ]},
  {kind:'thought',name:'wafer 工艺偏移导致边缘 die 异常',cat:'工艺',children:[
    {kind:'task',name:'Shmoo 对比 & 边缘 die 分析',status:'进行中',owner:'李娜',dept:'DA',prog:65,children:[
      {kind:'thought',name:'VDDmin 漂移是否工艺相关',cat:'工艺',children:[
        {kind:'task',name:'工艺 split 数据回溯',status:'已完成',owner:'陈明',dept:'DA',prog:100,children:[
          {kind:'task',name:'与 fab 确认 implant 剂量',status:'已拒绝',owner:'周强',dept:'PE',prog:10,children:[]},
        ]},
      ]},
    ]},
    {kind:'task',name:'CP 测试程序 guardband 调整',status:'待开始',owner:'王芳',dept:'CP',prog:0,children:[]},
  ]},
];

/* ---------- shared helpers ---------- */
function hasKids(n){return n.children&&n.children.length;}
function icon(n,sz){
  if(n.kind==='thought') return '<span style="color:var(--amber);flex:none">'+svg('bulb',sz||14)+'</span>';
  return '<span class="dot" style="background:'+SC[n.status]+'"></span>';
}
function meta(n){
  if(n.kind==='thought') return n.cat?'<span class="tag-cat">'+n.cat+'</span>':'';
  return '<span class="muted">'+n.owner+' · '+n.status+'</span>';
}
function tasksUnder(n,acc){(n.children||[]).forEach(function(c){if(c.kind==='task')acc.push(c);tasksUnder(c,acc);});return acc;}
function summary(n){
  const ts=tasksUnder(n,[]);
  if(!ts.length) return '';
  const avg=Math.round(ts.reduce(function(s,t){return s+(t.prog||0);},0)/ts.length);
  const dots=ts.slice(0,6).map(function(t){return '<span class="d" style="background:'+SC[t.status]+'"></span>';}).join('');
  const col=avg>=80?'#10b981':avg>=40?'#3b82f6':'#94a3b8';
  return '<span class="sumwrap"><span class="sumdots">'+dots+'</span><span class="pill">'+ts.length+' 项</span><span class="bar"><span style="width:'+avg+'%;background:'+col+'"></span></span></span>';
}
const TASK_TOTAL=TREE.reduce(function(s,t){return s+tasksUnder(t,[]).length;},0);
const TH_TOTAL=(function(){var c=0;(function walk(arr){arr.forEach(function(n){if(n.kind==='thought')c++;if(n.children)walk(n.children);});})(TREE);return c;})();

function shell(title,sub,right,inner){
  return '<div class="dir"><div class="dh"><span class="ic">'+svg('listTree',16)+'</span><div><div class="t">'+title+'</div><div class="s">'+sub+'</div></div><span class="spacer"></span>'+(right||'')+'</div>'+inner+'</div>';
}

/* ====== S1 · file tree with guide lines ====== */
function s1(n){
  const has=hasKids(n);
  let h='<div class="node">';
  h+='<div class="row" '+(has?'data-toggle="1"':'')+'>'+(has?svg('chev',14):'<span class="chev-sp"></span>')+icon(n)+'<span class="nm'+(n.kind==='thought'?' t':'')+'">'+n.name+'</span>'+meta(n)+'</div>';
  if(has) h+='<div class="children">'+n.children.map(s1).join('')+'</div>';
  return h+'</div>';
}
function buildS1(){return shell('节点目录','跟随思维导图结构','<span class="tool" data-collapse-all>全部折叠</span>','<div class="list s1">'+TREE.map(s1).join('')+'</div>');}

/* ====== S2 · numbered outline ====== */
function s2(n,prefix){
  const has=hasKids(n),isT=n.kind==='thought';
  let h='<div class="node">';
  h+='<div class="row" '+(has?'data-toggle="1"':'')+'>'+(has?svg('chev',14):'<span class="chev-sp"></span>')+'<span class="num'+(isT?' t':'')+'">'+prefix+'</span>'+icon(n)+'<span class="nm'+(isT?' t':'')+'">'+n.name+'</span>'+meta(n)+'</div>';
  if(has) h+='<div class="children">'+n.children.map(function(c,i){return s2(c,prefix+'.'+(i+1));}).join('')+'</div>';
  return h+'</div>';
}
function buildS2(){return shell('节点目录','层级编号 1 / 1.1 / 1.1.1','<span class="mini">思路 '+TH_TOTAL+' · 任务 '+TASK_TOTAL+'</span>','<div class="list s2">'+TREE.map(function(c,i){return s2(c,(i+1));}).join('')+'</div>');}

/* ====== S3 · nested containment cards ====== */
function s3(n){
  const has=hasKids(n);
  if(n.kind==='thought'||has){
    return '<div class="node gcard '+(n.kind==='thought'?'g-th':'g-tk')+'">'+
      '<div class="ghead" '+(has?'data-toggle="1"':'')+'>'+(has?svg('chev',14):'<span class="chev-sp"></span>')+icon(n,13)+'<span class="gname">'+n.name+'</span>'+meta(n)+'</div>'+
      (has?'<div class="children gbody">'+n.children.map(s3).join('')+'</div>':'')+'</div>';
  }
  return '<div class="row leaf">'+'<span class="chev-sp"></span>'+icon(n)+'<span class="nm">'+n.name+'</span>'+meta(n)+'</div>';
}
function buildS3(){return shell('节点目录','嵌套卡片 · 父节点包裹子节点',null,'<div class="list" style="padding:5px 8px">'+TREE.map(s3).join('')+'</div>');}

/* ====== S5 · compact tree + rollup summary ====== */
function s5(n){
  const has=hasKids(n);
  let h='<div class="node">';
  h+='<div class="row" '+(has?'data-toggle="1"':'')+'>'+(has?svg('chev',14):'<span class="chev-sp"></span>')+icon(n)+'<span class="nm'+(n.kind==='thought'?' t':'')+'">'+n.name+'</span>'+(has?summary(n):meta(n))+'</div>';
  if(has) h+='<div class="children">'+n.children.map(s5).join('')+'</div>';
  return h+'</div>';
}
function buildS5(){return shell('节点目录','父节点显示其下任务状态/进度汇总','<span class="tool" data-collapse-all>全部折叠</span>','<div class="list s1">'+TREE.map(s5).join('')+'</div>');}

/* ---------- mount static schemes + collapse delegation ---------- */
const SCHEMES=[
  {id:'①',nm:'缩进树线（文件树）',dsc:'经典文件树：每层虚线引导 + ▾ 折叠箭头，任意深度都能一眼看清父子归属。最通用、最省空间。',build:buildS1},
  {id:'②',nm:'层级编号大纲',dsc:'每个节点带 1 / 1.1 / 1.1.1 编号，深层节点也能被精确指代（开会/写文档引用某条最方便）。',build:buildS2},
  {id:'③',nm:'嵌套包裹卡片',dsc:'父节点是一张浅色容器卡，子节点物理"嵌"在其中（思路=琥珀卡 / 带子任务的任务=灰卡）。包裹关系最直观，利于看"整块内容"。',build:buildS3},
  {id:'⑤',nm:'折叠树 + 汇总徽章',dsc:'在①基础上，每个父节点直接显示其下任务的状态色点 + 项数 + 平均进度条。不展开也能掌握整体进展，最适合"总览"。',build:buildS5},
];
let gridHTML=SCHEMES.map(function(s){
  return '<div class="panel"><div class="ph"><span class="badge">'+s.id+'</span><span class="nm">'+s.nm+'</span></div><div class="pd">'+s.dsc+'</div>'+s.build()+'</div>';
}).join('');
/* S4 placeholder panel (built separately, interactive drill) */
gridHTML+='<div class="panel" id="panel-s4"><div class="ph"><span class="badge">④</span><span class="nm">逐层下钻（抽屉式）</span></div><div class="pd">仿 Finder 分栏：只显示当前层级 + 面包屑路径，点带 › 的节点钻入下一层。再深的树也永远"很浅"，适合层级极多时聚焦某一支。</div><div class="dir" id="s4dir"></div></div>';
document.getElementById('grid').innerHTML=gridHTML;

/* collapse toggle (event delegation) */
document.getElementById('grid').addEventListener('click',function(e){
  const all=e.target.closest('[data-collapse-all]');
  if(all){
    const list=all.closest('.dir').querySelector('.list');
    const nodes=list.querySelectorAll('.node');
    const anyOpen=[].some.call(nodes,function(nd){return hasKids2(nd)&&!nd.classList.contains('collapsed');});
    nodes.forEach(function(nd){if(hasKids2(nd)){nd.classList.toggle('collapsed',anyOpen);}});
    all.textContent=anyOpen?'全部展开':'全部折叠';
    return;
  }
  const tog=e.target.closest('[data-toggle]');
  if(tog){const node=tog.closest('.node'); if(node) node.classList.toggle('collapsed');}
});
function hasKids2(nd){return !!nd.querySelector(':scope > .children');}

/* ====== S4 · drill (interactive) ====== */
let s4path=[];
function s4ctx(){
  let list=TREE,node=null,names=[];
  for(const i of s4path){node=list[i];names.push(node.name);list=node.children||[];}
  return {list:list,node:node,names:names};
}
function s4render(){
  const c=s4ctx();
  let crumb='<div class="crumb"><a data-go="-1">Case 全部</a>';
  c.names.forEach(function(nm,i){crumb+='<span class="sep">›</span>'+(i===c.names.length-1?'<span class="cur">'+nm+'</span>':'<a data-go="'+i+'">'+nm+'</a>');});
  crumb+='</div>';
  let rows='';
  if(!c.list.length){rows='<div class="muted" style="padding:14px;text-align:center">该节点下无子项（叶子）</div>';}
  c.list.forEach(function(n,i){
    const has=hasKids(n);
    rows+='<div class="drow '+(has?'has':'')+'" data-idx="'+i+'">'+icon(n,15)+'<span class="nm'+(n.kind==='thought'?' t':'')+'">'+n.name+'</span>'+
      (n.kind==='task'?'<span class="muted">'+n.owner+' · '+n.status+'</span>':'')+
      (has?'<span class="cnt">'+n.children.length+' 项</span>'+svg('chev',14).replace('chev','')+'':'')+'</div>';
  });
  document.getElementById('s4dir').innerHTML=crumb+'<div class="list">'+rows+'</div>';
}
document.getElementById('panel-s4').addEventListener('click',function(e){
  const go=e.target.closest('[data-go]');
  if(go){const k=parseInt(go.getAttribute('data-go'));s4path=k<0?[]:s4path.slice(0,k+1);s4render();return;}
  const row=e.target.closest('.drow.has');
  if(row){s4path=s4path.concat(parseInt(row.getAttribute('data-idx')));s4render();}
});
s4render();
</script>
</body>
</html>
